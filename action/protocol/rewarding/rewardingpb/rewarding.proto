// To compile the proto, run:
//      protoc --go_out=plugins=grpc:. *.proto
syntax = "proto3";
package rewardingpb;
option go_package = "github.com/iotexproject/iotex-core/action/protocol/rewarding/rewardingpb";

message Admin {
    string blockReward = 1;
    string epochReward = 2;
    uint64 numDelegatesForEpochReward = 3;
    string foundationBonus = 4;
    uint64 numDelegatesForFoundationBonus = 5;
    uint64 foundationBonusLastEpoch = 6;
    uint64 productivityThreshold = 7;
}

message Fund {
    string totalBalance = 1;
    string unclaimedBalance = 2;
}

message RewardHistory {
    uint64 height = 1;
}

message Account {
    string balance = 1;
}

message Exempt {
    repeated bytes addrs = 1;
}

message RewardLog {
    enum RewardType {
        BLOCK_REWARD = 0;
        EPOCH_REWARD = 1;
        FOUNDATION_BONUS= 2;
        PRIORITY_BONUS = 3;
        UNPRODUCTIVE_SLASH = 4;
        // IIP-59: per-voter share of a delegate's epoch reward after commission.
        VOTER_REWARD = 5;
        // IIP-59: delegate's commission (rate * epochReward) plus any dust left
        // over from integer-division of the voter split. Emitted once per
        // delegate that participated in the IIP-59 auto-split path.
        DELEGATE_COMMISSION = 6;
    }
    RewardType type = 1;
    string addr = 2;
    string amount = 3;
}

message RewardLogs {
    repeated RewardLog logs = 1;
}

// IIP-59: per-delegate accumulator that holds block-reward credits during an
// epoch. Drained at epoch close by GrantEpochReward, which calls
// distributeVoterReward on the accumulated amount. rewardAddr and
// commissionRate are frozen at credit time so an orphan drain (delegate
// churned out of top-N) still has enough to split.
message PendingBlockReward {
    string amount = 1;
    bytes rewardAddr = 2;
    uint64 commissionRate = 3;
}

// IIP-59: sorted, deduped index of delegate identities that currently hold a
// PendingBlockReward entry. Iterated in-order at epoch close for deterministic
// drain sequence. Identities are stored as raw address bytes.
message PendingBlockRewardIndex {
    repeated bytes identities = 1;
}
