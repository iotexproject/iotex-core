// To compile the proto, run:
//      protoc --go_out=plugins=grpc:. *.proto
syntax = "proto3";
package rewardingpb;
option go_package = "github.com/iotexproject/iotex-core/action/protocol/rewarding/rewardingpb";

message Admin {
    string blockReward = 1;
    string epochReward = 2;
    uint64 numDelegatesForEpochReward = 3;
    string foundationBonus = 4;
    uint64 numDelegatesForFoundationBonus = 5;
    uint64 foundationBonusLastEpoch = 6;
    uint64 productivityThreshold = 7;
}

message Fund {
    string totalBalance = 1;
    string unclaimedBalance = 2;
}

message RewardHistory {
    uint64 height = 1;
}

message Account {
    string balance = 1;
}

message Exempt {
    repeated bytes addrs = 1;
}

message RewardLog {
    enum RewardType {
        BLOCK_REWARD = 0;
        EPOCH_REWARD = 1;
        FOUNDATION_BONUS= 2;
        PRIORITY_BONUS = 3;
        UNPRODUCTIVE_SLASH = 4;
        // IIP-59 §10.2: emitted at Phase A entry when a live cursor is
        // detected from a previous era that failed to drain in time. The
        // stale cursor is deleted and its residue is rolled into the
        // fresh era's cursor materialization. addr encodes
        // "<target_era>:<delegates_remaining>" and amount encodes the
        // residue (leftover pool balance across the remaining delegates)
        // as a decimal string; both fields reuse the existing wire slots
        // to avoid a payload-shape change on the RewardLog message.
        EPOCH_DRAIN_OVERRUN = 5;
        // IIP-59 §10.3: informational log emitted at each
        // GrantVoterRewardChunk before the drain runs, so off-chain
        // observers can track cursor pile-up across a multi-block drain
        // without inspecting state directly. addr encodes
        // "<target_era>:<delegate_index>:<voter_index>:<delegates_remaining>";
        // amount is the fixed literal "0" (no monetary value — this is a
        // cursor snapshot, not a payout).
        CURSOR_PROGRESS = 6;
    }
    RewardType type = 1;
    string addr = 2;
    string amount = 3;
}

message RewardLogs {
    repeated RewardLog logs = 1;
}

// PendingBlockRewardPool holds a delegate's accumulated block-reward
// balance for IIP-59 §3.2. Written at block time when a producer earns the
// voter portion of a block reward; drained at epoch close through the
// batched voter split. One entry per delegate under the pending
// pool key prefix.
message PendingBlockRewardPool {
    bytes amount = 1;
}

// EpochDrainDelegateWork is one frozen per-delegate work item captured
// at the era boundary: delegate identifier, voter share, reward address,
// and epoch commission. Chunks in later blocks read this frozen record so
// they never recompute the target-era split from a partially produced live
// epoch, while PendingBlockRewardPool may keep accruing behind the drain.
message EpochDrainDelegateWork {
    bytes candidate_identifier = 1;
    bytes voter_amount_frozen  = 2;
    bytes reward_address       = 3;
    bytes epoch_commission     = 4;
    // Amount already distributed from voter_amount_frozen. This lets a
    // continuation give the final weighted voter the exact remainder without
    // rescanning every preceding voter on each block.
    bytes voter_amount_distributed = 5;
    // Total voter weight is frozen once when Phase A creates the cursor.
    // Continuation chunks use this value directly instead of recomputing it.
    bytes total_weight = 6;
    bytes snapshot_hash = 7;
    // Index of the final positive-weight voter in the circular traversal.
    uint32 last_weighted_index = 8;
    bool has_weighted_entries = 9;
    // Index of the first voter in the circular traversal. The canonical
    // snapshot remains address-sorted; chunks map logical indexes through
    // this offset.
    uint32 voter_start_index = 10;
}

// EpochDrainCursor checkpoints a multi-block IIP-59 era-boundary drain
// of PendingBlockRewardPool balances into voter accounts. TargetEra is
// the era ID being drained; DelegateIndex is the resume position in
// the frozen Delegates slice; VoterIndex is the resume position in
// the current delegate's snap.Entries when a per-block voter cap
// stops payout mid-delegate. VoterIndex is 0 whenever a delegate
// entry is fresh; it's non-zero only for the entry pointed to by
// DelegateIndex. Cursor presence in the RewardingNamespace signals a
// drain is in progress and the system-action layer must emit a
// continuation grant on the next block. Absence = no drain in progress.
message EpochDrainCursor {
    uint64 target_era     = 1;
    uint32 delegate_index = 2;
    repeated EpochDrainDelegateWork delegates = 3;
    uint32 voter_index    = 4;
    // Domain-separated hash of the parent block hash and target era. The
    // same value determines every circular list offset in this settlement.
    bytes settlement_seed = 5;
    // Original canonical delegate-list index selected by settlement_seed.
    // Delegates is persisted in the resulting circular traversal order.
    uint32 delegate_start_index = 6;
}

// VoterRewardAddress is the effective post-IIP-59 delegate payout address.
// explicitly_set distinguishes an address configured after activation from
// the default that follows the candidate's current owner.
message VoterRewardAddress {
    bytes address = 1;
    bool explicitly_set = 2;
}
