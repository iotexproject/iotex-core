// To compile the proto, run:
//      protoc --go_out=plugins=grpc:. *.proto

syntax = "proto3";
package stakingpb;
option go_package = "github.com/iotexproject/iotex-core/action/protocol/staking/stakingpb";
import "google/protobuf/timestamp.proto";

message Bucket {
  uint64 index = 1;
  string candidateAddress = 2;
  string stakedAmount = 3;
  uint32 stakedDuration = 4;
  google.protobuf.Timestamp createTime = 5;
  google.protobuf.Timestamp stakeStartTime = 6;
  google.protobuf.Timestamp unstakeStartTime = 7;
  bool autoStake = 8;
  string owner = 9;
  string contractAddress = 10;
  uint64 stakedDurationBlockNumber = 11;
  uint64 createBlockHeight = 12;
  uint64 stakeStartBlockHeight = 13;
  uint64 unstakeStartBlockHeight = 14;
}

message BucketIndices {
    repeated uint64 indices = 1;
}

message Candidate {
    string ownerAddress = 1;
    string operatorAddress = 2;
    string rewardAddress = 3;
    string name = 4;
    string votes = 5;
    uint64 selfStakeBucketIdx = 6;
    string selfStake = 7;
    string identifierAddress = 8; //if the field is empty, set it to the old owner address
    bytes pubkey = 9; // BLS public key
    uint64 deactivatedAt = 10;
    // Enables protocol-native voter reward distribution. Existing Hermes
    // candidates are migrated at activation; later opt-in is owner-controlled.
    // This transition is one-way.
    bool voterRewardOnchainOptIn = 11;
    // True when rewardAddress was explicitly set by a candidate action after
    // IIP-59 activation.
    bool rewardAddressUpdated = 12;
}

message Candidates {
    repeated Candidate candidates = 1;
}

message TotalAmount {
    string amount = 1;
    uint64 count = 2;
}

message BucketType {
    string amount = 1;
    uint64 duration = 2;
    uint64 activatedAt = 3;
}

message Endorsement {
    uint64 expireHeight = 1;
}

message SystemStakingContract {
    uint64 numOfBuckets = 1;
}

message SystemStakingBucket {
    string candidate = 1;
    string owner = 2;
    string amount = 3;
    uint64 duration = 4;
    uint64 createdAt = 5;
    uint64 unlockedAt = 6;
    uint64 unstakedAt = 7;
    bool muted = 8;
    bool timestamped = 9;
}

message ExitQueue {
    uint64 epoch = 1;
}

// IIP-59: per-candidate poll snapshot frozen at PutPollResult. The rewarding
// protocol reads this at each epoch close; nothing else mutates it during the
// reward era, so mid-era DelegateProfile changes do not retroactively re-split
// rewards.
//
// The snapshot is scalars only. It used to also materialize the delegate's
// entire (voter, weight) list at every era boundary, which made the boundary
// cost proportional to the voter population and put a redundant copy of the
// voter set into consensus state. The drain is voter-major now and recomputes
// each voter's weight from the era's copy-on-write bucket window, so nothing
// reads that list.
message CandidatePollSnapshot {
    // Commission split frozen from the DelegateProfile contract at snapshot
    // time. Basis points in [0, 10000]. Both default to 10000 when
    // `registered` is false and on-chain reward distribution is enabled.
    uint64 blockCommissionBasisPoints = 1;
    uint64 epochCommissionBasisPoints = 2;
    // Whether the DelegateProfile contract returned both portion fields as
    // non-empty bytes at snapshot time.
    bool registered = 3;
    // Whether this reward era uses protocol-native distribution. The value is
    // frozen so mid-era candidate updates cannot change reward routing.
    bool onchainRewardEnabled = 4;
    // 5 was `entries`, the materialized per-voter weight list; 8 was
    // `lastWeightedIndex`, the position in that list that absorbed the
    // floor-division remainder; 9 was `hasWeightedEntries`, which distinguished
    // a valid index 0 from "no weights at all". None survive the removal of the
    // list: `totalWeight` below is now sourced from candidate.Votes, and
    // `totalWeight > 0` is exactly what `hasWeightedEntries` used to mean.
    // Retired, never reused.
    reserved 5, 8, 9;
    // The denominator the drain divides each recomputed voter weight by: the
    // frozen value of the candidate's Votes accumulator at the era boundary.
    // Big-endian unsigned. Zero means the era has no payable voter set for this
    // delegate and its pending pool rolls into a later era.
    bytes totalWeight = 6;
    // Deterministic digest of this delegate's frozen era parameters, computed
    // at freeze time from the scalars in this message plus the candidate
    // identifier. It is the join key off-chain consumers use to assemble the
    // partial DelegateDistributed logs one settlement emits across many blocks.
    bytes snapshotHash = 7;
    // IIP-59: the height this snapshot was frozen at, i.e. the era boundary H.
    // The drain runs several blocks later and must evaluate contract-staking
    // bucket durations against H, not against the block it happens to run in,
    // so H travels with the snapshot rather than being re-derived.
    uint64 freezeHeight = 10;
    // IIP-59: the candidate's self-stake bucket index at H. This is the only
    // candidate field the voter-weight recompute reads, so it is frozen as a
    // scalar rather than copy-on-written along with the whole candidate record.
    // math.MaxUint64 means "no self-stake bucket", matching
    // candidateNoSelfStakeBucketIndex.
    uint64 selfStakeBucketIdx = 11;
}

// IIP-59: one reference to a contract-staking (LSD) bucket. Contract-staking
// bucket IDs are only unique within a single staking contract, so a reference
// has to name both. `contract` is the 20-byte address bytes.
message ContractBucketRef {
    bytes contract = 1;
    uint64 index = 2;
}

// IIP-59: the set of contract-staking buckets owned by one address, stored in
// the staking namespace under {_lsdVoterIndex} || owner(20). This is the LSD
// counterpart of BucketIndices, which can only carry native bucket ids.
//
// Refs are sorted ascending by (contract bytes, index) before serialization so
// the encoded value is a function of the set alone and never of Go map order.
message ContractBucketRefs {
    repeated ContractBucketRef refs = 1;
}
