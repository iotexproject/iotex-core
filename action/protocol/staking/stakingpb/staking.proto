// To compile the proto, run:
//      protoc --go_out=plugins=grpc:. *.proto

syntax = "proto3";
package stakingpb;
option go_package = "github.com/iotexproject/iotex-core/action/protocol/staking/stakingpb";
import "google/protobuf/timestamp.proto";

message Bucket {
  uint64 index = 1;
  string candidateAddress = 2;
  string stakedAmount = 3;
  uint32 stakedDuration = 4;
  google.protobuf.Timestamp createTime = 5;
  google.protobuf.Timestamp stakeStartTime = 6;
  google.protobuf.Timestamp unstakeStartTime = 7;
  bool autoStake = 8;
  string owner = 9;
  string contractAddress = 10;
  uint64 stakedDurationBlockNumber = 11;
  uint64 createBlockHeight = 12;
  uint64 stakeStartBlockHeight = 13;
  uint64 unstakeStartBlockHeight = 14;
}

message BucketIndices {
    repeated uint64 indices = 1;
}

message Candidate {
    string ownerAddress = 1;
    string operatorAddress = 2;
    string rewardAddress = 3;
    string name = 4;
    string votes = 5;
    uint64 selfStakeBucketIdx = 6;
    string selfStake = 7;
    string identifierAddress = 8; //if the field is empty, set it to the old owner address
    bytes pubkey = 9; // BLS public key
    uint64 deactivatedAt = 10;
    // IIP-59: delegate has opted into protocol-native voter reward distribution.
    // Mutated by SetVoterRewardOptIn action; effect delayed 1 epoch via the
    // PutPollResult snapshot (rewarding reads the frozen value, not this live one).
    bool voterRewardOnchainOptIn = 11;
}

message Candidates {
    repeated Candidate candidates = 1;
}

message TotalAmount {
    string amount = 1;
    uint64 count = 2;
}

message BucketType {
    string amount = 1;
    uint64 duration = 2;
    uint64 activatedAt = 3;
}

message Endorsement {
    uint64 expireHeight = 1;
}

message SystemStakingContract {
    uint64 numOfBuckets = 1;
}

message SystemStakingBucket {
    string candidate = 1;
    string owner = 2;
    string amount = 3;
    uint64 duration = 4;
    uint64 createdAt = 5;
    uint64 unlockedAt = 6;
    uint64 unstakedAt = 7;
    bool muted = 8;
    bool timestamped = 9;
}

message ExitQueue {
    uint64 epoch = 1;
}

// IIP-59: per-voter aggregated weight entry inside a CandidatePollSnapshot.
// `voter` is the 20-byte address bytes; `weight` is the big-endian encoding
// of a big.Int. Entries within a snapshot are sorted ascending by `voter`.
message VoterWeightEntry {
    bytes voter = 1;
    bytes weight = 2;
}

// IIP-59: per-candidate poll snapshot frozen at PutPollResult. The rewarding
// protocol reads this at each epoch close; nothing else mutates it during the
// epoch, so mid-epoch changes to the DelegateProfile contract or to the
// candidate's opt-in flag do not retroactively re-split the current epoch's
// rewards.
message CandidatePollSnapshot {
    // Commission split frozen from the DelegateProfile contract at snapshot
    // time. Basis points in [0, 10000]. Both zero when `registered` is false.
    uint64 blockCommissionBasisPoints = 1;
    uint64 epochCommissionBasisPoints = 2;
    // Whether the DelegateProfile contract returned both portion fields as
    // non-empty bytes at snapshot time. False ⇒ the commission rates above
    // are meaningless; rewarding MUST fall back to the legacy path.
    bool registered = 3;
    // `staking.Candidate.VoterRewardOnchainOptIn` at snapshot time. The
    // delayed-1-epoch semantics live here.
    bool voterRewardOnchainOptIn = 4;
    // Per-voter aggregated weight entries, sorted ascending by `voter` bytes.
    // Empty in the initial PR that introduces this message; the voter-weight
    // source is a separate follow-up. An empty list means the downstream
    // reward split degenerates to full-amount-to-delegate.
    repeated VoterWeightEntry entries = 5;
    // Cached deterministic metadata used to keep continuation work bounded by
    // the configured voter window instead of rescanning all entries.
    bytes totalWeight = 6;
    bytes snapshotHash = 7;
    uint32 lastWeightedIndex = 8;
    bool hasWeightedEntries = 9;
}
