name: ci

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO111MODULE: on

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # only-new-issues reads the PR diff
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # The existing codebase has ~700 findings under .golangci.yml, so only
      # issues introduced by the PR are reported until they are cleaned up.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          only-new-issues: true

  ci:
    name: ci flow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build Go
        run: go build ./...

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      # -gcflags="all=-N -l" disables inlining, which gomonkey patches rely on.
      - name: Run Test
        id: unittest
        run: go test -gcflags="all=-N -l" -short -covermode=count -coverprofile=coverage.txt ./...

      - name: Run Benchmark (crypto)
        run: go test -run=XXX -bench=. ./crypto

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Fuzz harness for crypto/action/state codec & primitives. Runs each
      # target for 30s. Marked continue-on-error while existing panic sites
      # found by the harness are triaged in follow-ups; promote to required
      # after they are fixed.
      - name: Run Fuzz (short)
        continue-on-error: true
        shell: bash
        run: make fuzz-short

