name: ci

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  # runs on master as well, so the Go build cache saved there is restored by
  # pull requests (a cache saved by one pull request is not visible to others)
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO111MODULE: on

jobs:
  ci:
    name: ci flow
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    env:
      # one set of compiler flags for build, vet and test, so packages are
      # compiled once and shared through the build cache; -l (no inlining) is
      # what the gomonkey-based tests need
      GOFLAGS: -gcflags=all=-l
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build Go
        run: go build ./...

      - name: Vet
        run: |
          go mod tidy
          go vet $(go list ./... | grep -v /vendor/ | grep -v /explorer/idl/ | grep -v /api/idl/)

      - name: Run Test
        id: unittest
        shell: bash
        run: |
          ./go.test.sh
          go test -run=XXX -bench=. $(go list ./crypto)

      - name: Make Minicluster
        if: github.event.pull_request.merged == true
        id: minicluster
        shell: bash
        run: |
          make minicluster

  # Fuzz harness for crypto/action/state codec & primitives. Runs each target
  # for 30s, in its own job so it does not add to the ci flow's wall time.
  # Marked continue-on-error while existing panic sites found by the harness
  # are triaged in follow-ups; promote to required after they are fixed.
  fuzz:
    name: fuzz (short)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # no shared cache here: this job finishes first, and saving its partial
      # cache under the same key would stop ci flow from saving the full one
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Run Fuzz (short)
        continue-on-error: true
        shell: bash
        run: make fuzz-short
